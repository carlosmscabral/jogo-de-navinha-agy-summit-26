name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      # Roda ANTES do `npm test` da raiz de propósito, não depois: `npm test` já inclui
      # `packages/sim` como seu último workspace (desde a Tarefa B7), então se o portão de
      # balanceamento falhar ali, `npm test` sai com código de erro e o job para -- o passo nomeado
      # abaixo nunca chegaria a rodar, exatamente no caso em que ele existe para ajudar. `npm run
      # build` já constrói tudo que `packages/sim` importa (`@jogo/shared` incluso), então rodar o
      # pacote isolado aqui, antes do `npm test` completo, é seguro. `npm test` mais abaixo continua
      # re-executando os testes do sim como parte normal da suíte -- redundante, mas inofensivo.
      - name: Balance gate (packages/sim)
        run: npm run test --workspace=packages/sim
      - run: npm test
